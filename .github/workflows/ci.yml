# ============================================================
# VIGIL — CI Pipeline
# Runs on every pull request: lint → test → build
# ============================================================

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ----------------------------------------------------------
  # Lint all Python code with Ruff
  # ----------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

  # ----------------------------------------------------------
  # Test each service independently (matrix strategy)
  # ----------------------------------------------------------
  test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        service:
          - sdk-gateway
          - event-ingestion
          - user-context
          - friction-classifier
          - intervention-engine
          - intervention-delivery
          - outcome-tracker
          - company-intel
          - tenant-management
          - notification-service
          - model-registry
          - stream-processor
          - admin-panel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r services/${{ matrix.service }}/requirements.txt

      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          python -m pytest tests/ -v --tb=short
        env:
          VIGIL_ENV: test

  # ----------------------------------------------------------
  # Build Docker images for each service (matrix strategy)
  # ----------------------------------------------------------
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        service:
          - sdk-gateway
          - event-ingestion
          - user-context
          - friction-classifier
          - intervention-engine
          - intervention-delivery
          - outcome-tracker
          - company-intel
          - tenant-management
          - notification-service
          - model-registry
          - stream-processor
          - admin-panel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/service.Dockerfile
          build-args: SERVICE_NAME=${{ matrix.service }}
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
